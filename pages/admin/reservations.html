<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../images/fitstop_white_logo.png" type="image/png">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <title>Reservations - FitSpot Admin</title>
</head>
<body class="admin-body">
<div class="admin-layout">

    <div class="sidebar">
        <div class="sidebar-brand">
            <img src="../../images/fitstop_white_logo.png" alt="FitSpot">
            <span>Gym Membership &amp; Class Booking</span>
        </div>

        <nav class="sidebar-menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="memberships.html">Membership Plans</a>
            <a href="classes.html">Fitness Classes</a>
            <a href="schedules.html">Schedules</a>
            <a href="members.html">Members</a>
            <a href="reservations.html" class="is-active" aria-current="page">Reservations</a>
            <a href="checkin.html">Gym Check-in</a>
        </nav>
    </div>

    <div class="admin-main">
        <header class="topbar">
            <div class="topbar-actions">
                <span class="admin-badge">Administrator</span>

                <div class="admin-user">
                    <button type="button" class="admin-avatar" id="admin-avatar" aria-haspopup="true" aria-expanded="false">YG</button>

                    <div class="admin-dropdown" id="admin-dropdown" hidden>
                        <button type="button" class="dropdown-item" data-open-form="profile">Profile</button>
                        <button type="button" class="dropdown-item" data-open-form="settings">Settings</button>
                        <div class="dropdown-divider"></div>
                        <button type="button" class="dropdown-item is-danger" id="logout-btn">Logout</button>
                    </div>
                </div>
            </div>
        </header>

        <div class="admin-content">

            <!-- ===== RESERVATIONS ===== -->
            <section class="admin-view is-active" id="view-reservations">
                <div class="section-head">
                    <div>
                        <h2>Reservations</h2>
                        <p>Confirm or cancel class reservations</p>
                    </div>
                </div>

                <div class="table-card">
                    <table data-entity="reservation">
                        <thead>
                            <tr>
                                <th>Member</th>
                                <th>Class</th>
                                <th>Schedule</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-reservations">
                            <tr>
                                <td colspan="5">Loading reservations...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </div>
    </div>
</div>

<!-- ===== ADMIN FORM MODAL ===== -->
<div class="modal-overlay" id="admin-form-modal" aria-hidden="true">
    <div class="modal auth-card" role="dialog" aria-modal="true" aria-labelledby="admin-modal-title">
        <button class="modal-close" type="button" aria-label="Close">&times;</button>

        <div class="modal-body">
            <h2 id="admin-modal-title">Settings</h2>

            <form id="admin-form">
                <div class="form-fields"></div>

                <div class="form-actions">
                    <button type="submit">Save</button>
                    <button type="button" class="btn-cancel" data-close>Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="../../js/toast.js" defer></script>
<script src="../../js/reload.js" defer></script>
<script src="../../js/api.js" defer></script>
    <script src="../../js/script.js" defer></script>
<script src="../../js/admin.js" defer></script>
</body>
</html>
