<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../images/fitstop_white_logo.png" type="image/png">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../../css/user.css">
    <title>Membership Plans - FitSpot Member</title>
</head>
<body class="admin-body user-body">
<div class="admin-layout">

    <div class="sidebar">
        <div class="sidebar-brand">
            <img src="../../images/fitstop_white_logo.png" alt="FitSpot">
            <span>Gym Membership &amp; Class Booking</span>
        </div>

        <nav class="sidebar-menu">
            <a href="dashboard.html">Overview</a>
            <a href="memberships.html" class="is-active" aria-current="page">Membership Plans</a>
            <a href="classes.html">Fitness Classes</a>
            <a href="bookings.html">My Bookings</a>
            <a href="checkin.html">Gym Check-in</a>
            <a href="profile.html">Profile</a>
        </nav>
    </div>

    <div class="admin-main">
        <header class="topbar">
            <div class="topbar-actions">
                <span class="admin-badge">Member</span>

                <div class="admin-user">
                    <button type="button" class="admin-avatar" id="user-avatar" aria-haspopup="true" aria-expanded="false">JD</button>

                    <div class="admin-dropdown" id="user-dropdown" hidden>
                        <a class="dropdown-item" href="profile.html">Profile</a>
                        <a class="dropdown-item" href="bookings.html">My Bookings</a>
                        <div class="dropdown-divider"></div>
                        <button type="button" class="dropdown-item is-danger" id="user-logout">Logout</button>
                    </div>
                </div>
            </div>
        </header>

        <div class="admin-content">

            <!-- ===== MEMBERSHIP PLANS ===== -->
            <section class="admin-view is-active" id="view-plans">
                <div class="section-head">
                    <div>
                        <h2>Membership Plans</h2>
                        <p>Compare plans, prices, and inclusions</p>
                    </div>
                </div>

                <div class="plans-grid" id="plans-grid">
                    <p class="empty-state">Loading membership plans...</p>
                </div>
            </section>

        </div>
    </div>
</div>

<script src="../../js/toast.js" defer></script>
<script src="../../js/api.js" defer></script>
<script src="../../js/user.js" defer></script>
</body>
</html>
