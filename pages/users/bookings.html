<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../images/fitstop_white_logo.png" type="image/png">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../../css/user.css">
    <title>My Bookings - FitSpot Member</title>
</head>
<body class="admin-body user-body">
<div class="admin-layout">

    <div class="sidebar">
        <div class="sidebar-brand">
            <img src="../../images/fitstop_white_logo.png" alt="FitSpot">
            <span>Gym Membership &amp; Class Booking</span>
        </div>

        <nav class="sidebar-menu">
            <a href="dashboard.html">Overview</a>
            <a href="memberships.html">Membership Plans</a>
            <a href="classes.html">Fitness Classes</a>
            <a href="bookings.html" class="is-active" aria-current="page">My Bookings</a>
            <a href="checkin.html">Gym Check-in</a>
            <a href="profile.html">Profile</a>
        </nav>
    </div>

    <div class="admin-main">
        <header class="topbar">
            <div class="topbar-actions">
                <span class="admin-badge">Member</span>

                <div class="admin-user">
                    <button type="button" class="admin-avatar" id="user-avatar" aria-haspopup="true" aria-expanded="false">JD</button>

                    <div class="admin-dropdown" id="user-dropdown" hidden>
                        <a class="dropdown-item" href="profile.html">Profile</a>
                        <a class="dropdown-item" href="bookings.html">My Bookings</a>
                        <div class="dropdown-divider"></div>
                        <button type="button" class="dropdown-item is-danger" id="user-logout">Logout</button>
                    </div>
                </div>
            </div>
        </header>

        <div class="admin-content">

            <!-- ===== MY BOOKINGS ===== -->
            <section class="admin-view is-active" id="view-bookings">
                <div class="section-head">
                    <div>
                        <h2>My Bookings</h2>
                        <p>View and cancel your class reservations</p>
                    </div>
                    <a class="btn-pill" href="classes.html">+ Book a Class</a>
                </div>

                <div class="table-card" id="bookings-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Class</th>
                                <th>Schedule</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-bookings"></tbody>
                    </table>
                </div>

                <p class="empty-state" id="bookings-empty" hidden>
                    You have no bookings yet. Open Fitness Classes to reserve a slot.
                </p>
            </section>

        </div>
    </div>
</div>

<script src="../../js/toast.js" defer></script>
<script src="../../js/reload.js" defer></script>
<script src="../../js/api.js" defer></script>
<script src="../../js/user.js" defer></script>
</body>
</html>
